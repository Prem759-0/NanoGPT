name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub

      - name: Upload files to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c '
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("Notice: HF_TOKEN secret is not set in GitHub repository settings. Skipping HF sync.")
              sys.exit(0)

          api = HfApi(token=token)
          repo = "a7006418/moon-ai-backend"
          print(f"Syncing app.py to {repo}...")
          api.upload_file(path_or_fileobj="app.py", path_in_repo="app.py", repo_id=repo, repo_type="space")
          if os.path.exists("requirements.txt"):
              print(f"Syncing requirements.txt to {repo}...")
              api.upload_file(path_or_fileobj="requirements.txt", path_in_repo="requirements.txt", repo_id=repo, repo_type="space")
          print("Successfully updated Hugging Face Space via HfApi!")
          '
