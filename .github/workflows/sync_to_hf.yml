name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://a7006418:$HF_TOKEN@huggingface.co/spaces/a7006418/moon-ai-backend main
            echo "Successfully pushed to Hugging Face Spaces!"
          else
            echo "Notice: HF_TOKEN secret is not set in GitHub repository settings. Skipping action sync."
          fi
