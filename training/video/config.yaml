model:
  name: "moon-video-v0"
  num_frames: 16
  fps: 8
  frame_size: 128
  latent_channels: 4
  unet_base_channels: 48
  cross_attention_dim: 256
  timesteps: 1000

training:
  batch_size: 1
  learning_rate: 8.0e-5
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  max_steps: 1000
  checkpoint_every: 250
  val_every: 100
  seed: 42

paths:
  manifest: "datasets/video/manifest.jsonl"
  output_dir: "models/checkpoints/moon_video"
  log_dir: "data/reports/training/moon_video"
