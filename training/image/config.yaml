model:
  name: "moon-image-v0"
  image_size: 256
  latent_channels: 4
  unet_base_channels: 64
  cross_attention_dim: 256
  timesteps: 1000

training:
  batch_size: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  max_steps: 1000
  warmup_steps: 100
  checkpoint_every: 250
  val_every: 100
  mixed_precision: "auto"
  seed: 42

paths:
  manifest: "datasets/image/manifest.jsonl"
  output_dir: "models/checkpoints/moon_image"
  log_dir: "data/reports/training/moon_image"
